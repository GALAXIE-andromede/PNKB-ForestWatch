name: Abonnements Telegram PNKB

on:
  schedule:
    - cron: "30 9 * * *"   # tous les jours à 09:30 UTC
  workflow_dispatch:         # permet aussi le déclenchement manuel

permissions:
  contents: write

jobs:
  abonnements:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

- name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

- name: Installation des dépendances
        run: pip install requests

- name: Traitement des nouveaux abonnés Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/satellite_scan.py --abonnements

- name: Commit de la liste des abonnés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/subscribers.json
          git commit -m "Abonnements Telegram : mise à jour du $(date -u +%F)" || echo "Aucun changement à committer"
          git push
